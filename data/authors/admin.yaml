bio: |
  I am an ecologist looking at patterns of biodiversity and associated ecosystem services at different spatial and temporal scales. As a postdoctoral researcher in the Department of Community Ecology at the Helmholtz Centre for Environmental Research (UFZ), I investigate how pollinators and the services they provide are influenced by landscape and land-use intensity. 

My main research interests focus on landscape ecology, macroecology, agro-ecology, pollination services and biological control.

